          <!-- Interactive Logic -->
          <script>
            (function () {
              // Horizontal scroller controls
              const carousel = document.getElementById("hourly-carousel");
              const leftBtn = document.getElementById("scroll-left");
              const rightBtn = document.getElementById("scroll-right");

              if (carousel && leftBtn && rightBtn) {
                leftBtn.addEventListener("click", () => {
                  carousel.scrollBy({ left: -260, behavior: "smooth" });
                });
                rightBtn.addEventListener("click", () => {
                  carousel.scrollBy({ left: 260, behavior: "smooth" });
                });
              }

              // Refresh button micro-interaction
              const refreshBtn = document.getElementById("refresh-btn");
              const refreshIcon = document.getElementById("refresh-icon");
              const updateLabel = document.getElementById("update-label");

              if (refreshBtn && refreshIcon && updateLabel) {
                refreshBtn.addEventListener("click", () => {
                  refreshIcon.classList.add("rotate-180");
                  updateLabel.textContent = "Updating feed...";
                  setTimeout(() => {
                    refreshIcon.classList.remove("rotate-180");
                    updateLabel.textContent = "Just now";
                  }, 650);
                });
              }

              // Chip selector input auto-fill
              const searchInput = document.getElementById("city-search");
              const chips = document.querySelectorAll(".city-chip");
              chips.forEach((chip) => {
                chip.addEventListener("click", () => {
                  if (searchInput) {
                    searchInput.value = chip.textContent.trim();
                    searchInput.focus();
                  }
                });
              });
            })();
